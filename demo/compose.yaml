services:
  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports:
      - "8080:80"
    volumes:
      - site-data:/site:ro
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ZEITFENSTER_ALLOWED_EMBED_ORIGINS: "${ZEITFENSTER_ALLOWED_EMBED_ORIGINS:-'none'}"
    depends_on:
      - app
    networks:
      - frontend

  app:
    build: ..
    volumes:
      - site-data:/site
      - ./config.yaml:/etc/zeitfenster/config.yaml:ro
    env_file:
      - ./.env
    depends_on:
      init-calendars:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - frontend
      - backend
    expose:
      - "8000"

  radicale:
    image: tomsquest/docker-radicale:latest@sha256:419e0c005b63bd475d50f73c5e7ff2b1f04924edb94af525fa86faed213c632a
    volumes:
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
      - radicale-data:/data
    networks:
      - backend
    expose:
      - "5232"

  init-calendars:
    image: curlimages/curl:latest@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    volumes:
      - ./init-calendars.sh:/init-calendars.sh:ro
    entrypoint: ["/bin/sh", "/init-calendars.sh"]
    depends_on:
      - radicale
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "8025:8025"
    networks:
      - frontend
      - backend
    expose:
      - "1025"

volumes:
  site-data:
  radicale-data:

networks:
  frontend:
  backend:
    internal: true
