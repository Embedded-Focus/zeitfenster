services:
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "8080:80"
    volumes:
      - site-data:/site:ro
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ZEITFENSTER_ALLOWED_EMBED_ORIGINS: "${ZEITFENSTER_ALLOWED_EMBED_ORIGINS:-'none'}"
    depends_on:
      - app
    networks:
      - frontend

  app:
    build: ..
    volumes:
      - site-data:/site
      - ./config.yaml:/etc/zeitfenster/config.yaml:ro
    env_file:
      - ./.env
    depends_on:
      init-calendars:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - frontend
      - backend
    expose:
      - "8000"

  radicale:
    image: tomsquest/docker-radicale:latest@sha256:419e0c005b63bd475d50f73c5e7ff2b1f04924edb94af525fa86faed213c632a
    volumes:
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
      - radicale-data:/data
    networks:
      - backend
    expose:
      - "5232"

  init-calendars:
    image: curlimages/curl:latest@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
    volumes:
      - ./init-calendars.sh:/init-calendars.sh:ro
    entrypoint: ["/bin/sh", "/init-calendars.sh"]
    depends_on:
      - radicale
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "8025:8025"
    networks:
      - frontend
      - backend
    expose:
      - "1025"

volumes:
  site-data:
  radicale-data:

networks:
  frontend:
  backend:
    internal: true
